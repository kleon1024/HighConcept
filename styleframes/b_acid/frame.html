<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Acid Night Parade</title>
<link rel="stylesheet" href="../../shape-of-sound/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/unbounded/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/major-mono-display/400.css">
<style>
  :root{
    --ink:#050507; --acid:#C6FF00; --violet:#8A2BFF; --pink:#FF2E93; --ice:#8FE9FF;
  }
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(120% 70% at 50% 34%, #120a22 0%, #07060c 55%, #040406 100%);}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
  svg.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
  #grain{mix-blend-mode:overlay;opacity:.32}
  #scan{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.35;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.55) 2px 3px);}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);}
  text{font-kerning:normal}
  .mono{font-family:'JetBrains Mono',monospace}
  .unb{font-family:'Unbounded','Noto Sans SC',sans-serif}
  .cjk{font-family:'Noto Sans SC',sans-serif;font-weight:900}
</style>
</head>
<body>
<div id="stage">
  <!-- holographic blur blobs -->
  <div class="blob" style="left:-120px;top:150px;width:720px;height:720px;background:radial-gradient(circle,#7a2cff 0%,rgba(122,44,255,0) 68%);filter:blur(40px);opacity:.85"></div>
  <div class="blob" style="left:560px;top:180px;width:520px;height:520px;background:radial-gradient(circle,#59d8ff 0%,rgba(89,216,255,0) 66%);filter:blur(50px);opacity:.55"></div>
  <div class="blob" style="left:560px;top:700px;width:640px;height:640px;background:radial-gradient(circle,#ff2e93 0%,rgba(255,46,147,0) 66%);filter:blur(50px);opacity:.6"></div>
  <div class="blob" style="left:-80px;top:1080px;width:520px;height:420px;background:radial-gradient(circle,#c6ff00 0%,rgba(198,255,0,0) 64%);filter:blur(60px);opacity:.26"></div>
  <div class="blob" style="left:-100px;top:1380px;width:1280px;height:300px;background:radial-gradient(closest-side,#ff2e93 0%,#8a2bff 45%,rgba(138,43,255,0) 100%);filter:blur(40px);opacity:.7"></div>
  <div class="blob" style="left:300px;top:1700px;width:700px;height:400px;background:radial-gradient(closest-side,#4a1cff 0%,rgba(74,28,255,0) 100%);filter:blur(50px);opacity:.5"></div>

  <svg class="layer" id="main" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- liquid chrome for the hero type: sky / horizon / ground banding, a touch of holo tint -->
      <linearGradient id="chromeTitle" gradientUnits="userSpaceOnUse" x1="0" y1="1024" x2="0" y2="1262">
        <stop offset="0" stop-color="#34448e"/>
        <stop offset=".16" stop-color="#7f9ff0"/>
        <stop offset=".34" stop-color="#d6eaff"/>
        <stop offset=".46" stop-color="#ffffff"/>
        <stop offset=".488" stop-color="#ffffff"/>
        <stop offset=".50" stop-color="#0e0820"/>
        <stop offset=".555" stop-color="#24163f"/>
        <stop offset=".69" stop-color="#5d3a8c"/>
        <stop offset=".83" stop-color="#ff9ed8"/>
        <stop offset=".93" stop-color="#fff2fb"/>
        <stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="chromeSub" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a6cb8"/>
        <stop offset=".3" stop-color="#d4e6ff"/>
        <stop offset=".48" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#120c24"/>
        <stop offset=".62" stop-color="#3a2c66"/>
        <stop offset=".85" stop-color="#c4b4f0"/>
        <stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="chromeMask" gradientUnits="userSpaceOnUse" x1="0" y1="260" x2="0" y2="900">
        <stop offset="0" stop-color="#5a6cb8"/>
        <stop offset=".10" stop-color="#d4e6ff"/>
        <stop offset=".17" stop-color="#ffffff"/>
        <stop offset=".176" stop-color="#120c24"/>
        <stop offset=".24" stop-color="#3a2c66"/>
        <stop offset=".33" stop-color="#a898dd"/>
        <stop offset=".40" stop-color="#f0eaff"/>
        <stop offset=".47" stop-color="#6c80c8"/>
        <stop offset=".55" stop-color="#e6f2ff"/>
        <stop offset=".585" stop-color="#ffffff"/>
        <stop offset=".592" stop-color="#140e28"/>
        <stop offset=".66" stop-color="#4a3a7a"/>
        <stop offset=".78" stop-color="#c4b4f0"/>
        <stop offset=".86" stop-color="#ffffff"/>
        <stop offset=".92" stop-color="#6070b8"/>
        <stop offset="1" stop-color="#dfe9ff"/>
      </linearGradient>
      <linearGradient id="chromeBB" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#6a7cc4"/>
        <stop offset=".28" stop-color="#e2efff"/>
        <stop offset=".45" stop-color="#ffffff"/>
        <stop offset=".47" stop-color="#120c22"/>
        <stop offset=".6" stop-color="#4c3a80"/>
        <stop offset=".8" stop-color="#d8c8ff"/>
        <stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8FE9FF"/>
        <stop offset=".35" stop-color="#b98cff"/>
        <stop offset=".65" stop-color="#FF2E93"/>
        <stop offset="1" stop-color="#C6FF00"/>
      </linearGradient>
      <linearGradient id="holoH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8FE9FF"/>
        <stop offset=".33" stop-color="#b98cff"/>
        <stop offset=".66" stop-color="#FF2E93"/>
        <stop offset="1" stop-color="#C6FF00"/>
      </linearGradient>
      <linearGradient id="extrude" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a1670"/>
        <stop offset="1" stop-color="#0a0516"/>
      </linearGradient>
      <linearGradient id="gridStroke" gradientUnits="userSpaceOnUse" x1="0" y1="1525" x2="0" y2="1920">
        <stop offset="0" stop-color="#ff5fb0"/>
        <stop offset=".25" stop-color="#c04bff"/>
        <stop offset=".7" stop-color="#6a4cff"/>
        <stop offset="1" stop-color="#8FE9FF"/>
      </linearGradient>
      <linearGradient id="gridFade" gradientUnits="userSpaceOnUse" x1="0" y1="1525" x2="0" y2="1920">
        <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
        <stop offset=".18" stop-color="#fff" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="gridMask"><rect x="0" y="1525" width="1080" height="400" fill="url(#gridFade)"/></mask>
      <linearGradient id="reflFade" gradientUnits="userSpaceOnUse" x1="0" y1="1525" x2="0" y2="1640">
        <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="reflMask"><rect x="0" y="1525" width="1080" height="140" fill="url(#reflFade)"/></mask>
      <radialGradient id="moonDisc" cx="540" cy="600" r="380" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#22103f"/>
        <stop offset=".7" stop-color="#0d0719"/>
        <stop offset="1" stop-color="#05040a"/>
      </radialGradient>
      <radialGradient id="lanternGlow">
        <stop offset="0" stop-color="#C6FF00" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#C6FF00" stop-opacity=".12"/>
        <stop offset="1" stop-color="#C6FF00" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="lanternGlowIce">
        <stop offset="0" stop-color="#8FE9FF" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#8FE9FF" stop-opacity=".12"/>
        <stop offset="1" stop-color="#8FE9FF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="smallLantern">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".35" stop-color="#e6ff7a"/>
        <stop offset="1" stop-color="#C6FF00" stop-opacity=".0"/>
      </radialGradient>
      <radialGradient id="eyeGlow">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".3" stop-color="#eaff8a"/>
        <stop offset="1" stop-color="#C6FF00"/>
      </radialGradient>
      <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse">
        <circle cx="4.5" cy="4.5" r="1.3" fill="#b98cff"/>
      </pattern>
      <radialGradient id="htFade" cx="540" cy="640" r="360" gradientUnits="userSpaceOnUse">
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
      </radialGradient>
      <mask id="htMask"><circle cx="540" cy="640" r="352" fill="url(#htFade)"/></mask>

      <!-- bevel + specular: makes flat gradient fills read as polished metal -->
      <filter id="bevelXL" x="-6%" y="-12%" width="112%" height="124%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="7" diffuseConstant="1.1" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting>
        <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.25" specularExponent="26" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.22" result="lit"/>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="0.95" result="o"/>
        <feComposite in="o" in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="bevelM" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="4.5" diffuseConstant="1.1" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
        <feSpecularLighting in="b" surfaceScale="4.5" specularConstant="1.4" specularExponent="24" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.25" result="lit"/>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="1" result="o"/>
        <feComposite in="o" in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="bevelS" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.1" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
        <feSpecularLighting in="b" surfaceScale="3" specularConstant="1.4" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.25" result="lit"/>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="1" result="o"/>
        <feComposite in="o" in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="warp" x="-10%" y="-30%" width="120%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="2" seed="7" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="liquid" x="-5%" y="-15%" width="110%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="1" seed="3" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>

    <g id="L_bg"></g>
    <g id="L_grid"></g>
    <g id="L_ring"></g>
    <g id="L_lanterns"></g>
    <g id="L_mask"></g>
    <g id="L_title"></g>
    <g id="L_parade"></g>
    <g id="L_band"></g>
    <g id="L_micro"></g>
    <g id="L_spark"></g>
  </svg>

  <svg class="layer" id="grain" viewBox="0 0 1080 1920">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1080" height="1920" filter="url(#noise)"/>
  </svg>
  <div id="scan"></div>
  <div id="vig"></div>
</div>

<script>
/* ---------- utilities ---------- */
const $ = (id) => document.getElementById(id);
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rand = rng(20261031);
const f1 = (n) => (+n).toFixed(1);
function hex(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mix(a,b,t){ const A=hex(a),B=hex(b); return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'; }
function sample(stops,t){ for(let i=0;i<stops.length-1;i++){ const [p0,c0]=stops[i],[p1,c1]=stops[i+1]; if(t>=p0&&t<=p1) return mix(c0,c1,(t-p0)/(p1-p0)); } return stops[stops.length-1][1]; }

/* tapered, curling thorn: the building block of the "tribal chrome" ornaments */
function thorn(x0,y0,ang,len,w,curl,n=26){
  const L=[],Rr=[];
  const dx=Math.cos(ang),dy=Math.sin(ang), px=-dy,py=dx;
  let prev=null;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const along=len*t, side=curl*len*t*t;
    pts.push([x0+dx*along+px*side, y0+dy*along+py*side]);
  }
  for(let i=0;i<=n;i++){
    const t=i/n;
    const a=pts[Math.max(0,i-1)], b=pts[Math.min(n,i+1)];
    let tx=b[0]-a[0], ty=b[1]-a[1]; const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
    const ww=w*Math.pow(1-t,1.15)*(0.55+0.45*Math.sin(Math.PI*Math.min(1,t*1.6+0.35)));
    L.push([pts[i][0]-ty*ww, pts[i][1]+tx*ww]);
    Rr.push([pts[i][0]+ty*ww, pts[i][1]-tx*ww]);
  }
  const all=L.concat(Rr.reverse());
  return 'M'+all.map(p=>f1(p[0])+','+f1(p[1])).join('L')+'Z';
}
function star4(cx,cy,r,thin=0.12){
  cx=+cx; cy=+cy; r=+r; const k=r*thin;
  return `M${cx},${cy-r} Q${cx+k},${cy-k} ${cx+r},${cy} Q${cx+k},${cy+k} ${cx},${cy+r} Q${cx-k},${cy+k} ${cx-r},${cy} Q${cx-k},${cy-k} ${cx},${cy-r}Z`;
}
function barcode(x,y,w,h,seed,color='#e8f0ff'){
  const r=rng(seed); let s='', cx=x;
  while(cx<x+w){ const bw=1+Math.floor(r()*4); if(r()>0.42) s+=`<rect x="${cx}" y="${y}" width="${bw}" height="${h}" fill="${color}"/>`; cx+=bw+ (r()>0.5?1:2); }
  return s;
}
function mono(x,y,str,{size=13,fill='#9fe8ff',op=0.85,anchor='start',ls=1.5,weight=400,rot=0,fam='mono'}={}){
  const tr = rot?` transform="rotate(${rot} ${x} ${y})"`:'';
  return `<text class="${fam}" x="${x}" y="${y}" font-size="${size}" fill="${fill}" fill-opacity="${op}" text-anchor="${anchor}" letter-spacing="${ls}" font-weight="${weight}"${tr}>${str}</text>`;
}
function cross(x,y,s=10,c='#9fe8ff'){ return `<path d="M${x-s},${y}H${x+s}M${x},${y-s}V${y+s}" stroke="${c}" stroke-width="1.2" opacity=".85"/>`; }

const CX=540, CY=640, RR=360;   // the lunar halo
const HZ=1525;                  // horizon line

/* ---------- background: star dust + far halo glows ---------- */
(function(){
  let s='';
  for(let i=0;i<220;i++){
    const x=rand()*1080, y=rand()*1500, r=rand()<0.9?rand()*1.1+0.3:rand()*1.8+1;
    s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${rand()<0.8?'#dfe8ff':'#C6FF00'}" opacity="${f1(0.25+rand()*0.6)}"/>`;
  }
  // big soft halo behind the moon
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR+40}" fill="none" stroke="#8FE9FF" stroke-width="40" opacity=".35" filter="url(#blur18)"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR+10}" fill="none" stroke="#ff2e93" stroke-width="18" opacity=".35" filter="url(#blur18)"/>`;
  $('L_bg').innerHTML=s;
})();

/* ---------- warped wireframe floor ---------- */
(function(){
  const f=430;
  const d=(x,z)=> 0.30*Math.sin(0.62*x+1.25*z)*Math.exp(-(z-0.9)/4.5)
                 + 0.62*Math.exp(-(x*x)/14-((z-2.1)**2)/0.9);
  const P=(x,z)=>[CX + f*x/z, HZ + f*(1-d(x,z))/z];
  let s='';
  const zs=[]; for(let z=0.82; z<70; z*=1.13) zs.push(z);
  for(const z of zs){
    let pts=[]; for(let x=-30;x<=30;x+=0.25){ pts.push(P(x,z)); }
    pts=pts.filter(p=>p[0]>-200&&p[0]<1280);
    s+=`<polyline points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
  }
  for(let x=-30;x<=30;x+=1.25){
    let pts=[]; for(let z=0.82; z<70; z*=1.03) pts.push(P(x,z));
    pts=pts.filter(p=>p[1]<1990&&p[0]>-300&&p[0]<1380);
    if(pts.length>1) s+=`<polyline points="${pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
  }
  $('L_grid').innerHTML =
    `<g mask="url(#gridMask)" fill="none" stroke="url(#gridStroke)" stroke-width="1.3" opacity=".9">${s}</g>`+
    `<g mask="url(#gridMask)" fill="none" stroke="#C6FF00" stroke-width="3" opacity=".12" filter="url(#blur6)">${s}</g>`+
    `<rect x="0" y="${HZ-1}" width="1080" height="2.5" fill="#ffd0ea"/>`+
    `<rect x="0" y="${HZ-6}" width="1080" height="12" fill="#ff2e93" opacity=".7" filter="url(#blur6)"/>`;
})();

/* ---------- lunar halo: moon disc + conic-chrome ring + tribal thorns + instrument ticks ---------- */
(function(){
  let s='';
  // moon disc + halftone edge
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR-6}" fill="url(#moonDisc)"/>`;
  s+=`<rect x="${CX-RR}" y="${CY-RR}" width="${2*RR}" height="${2*RR}" fill="url(#halftone)" mask="url(#htMask)" opacity=".55"/>`;
  // holographic crescent — the moon itself, glowing inside the halo
  s+=`<path d="M${CX+40},${CY-330} A330,330 0 1,1 ${CX+40},${CY+330} A300,330 0 1,0 ${CX+40},${CY-330}Z" fill="url(#holo)" opacity=".0"/>`;
  s+=`<g filter="url(#blur6)" opacity=".75"><path d="${crescent(CX,CY,332,46,-38)}" fill="url(#holo)"/></g>`;
  s+=`<path d="${crescent(CX,CY,332,40,-38)}" fill="url(#holo)" opacity=".55"/>`;

  // instrument rings
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR+46}" fill="none" stroke="#9fe8ff" stroke-width="1" opacity=".55"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR-30}" fill="none" stroke="#C6FF00" stroke-width="1" stroke-dasharray="2 7" opacity=".7"/>`;
  for(let a=0;a<360;a+=2.5){
    const r1=RR+46, big=a%30===0, mid=a%10===0, r2=r1+(big?18:mid?10:5);
    const t=a*Math.PI/180;
    s+=`<line x1="${f1(CX+Math.sin(t)*r1)}" y1="${f1(CY-Math.cos(t)*r1)}" x2="${f1(CX+Math.sin(t)*r2)}" y2="${f1(CY-Math.cos(t)*r2)}" stroke="${big?'#C6FF00':'#9fe8ff'}" stroke-width="${big?1.6:1}" opacity="${big?1:.6}"/>`;
  }
  ['000','030','060','090','120','150','180','210','240','270','300','330'].forEach((lab,i)=>{
    const t=i*30*Math.PI/180, r=RR+82;
    if([0,2,3,6,9,10].includes(i)) return; // keep clear for horns, thorn wings, lanterns and the title
    s+=mono(f1(CX+Math.sin(t)*r), f1(CY-Math.cos(t)*r+4), lab+'°',{size:11,anchor:'middle',fill:'#C6FF00',op:.9,ls:1});
  });

  // conic chrome ring built from small arcs (SVG has no conic gradient)
  const stops=[[0,'#ffffff'],[.05,'#c8e8ff'],[.11,'#4c5a92'],[.16,'#120e24'],[.185,'#fbf7ff'],[.25,'#9eaadb'],
               [.33,'#2a1d4a'],[.40,'#e4f8ff'],[.47,'#46357a'],[.54,'#0c0818'],[.60,'#ff9bd6'],[.655,'#ffffff'],
               [.72,'#6e5cb0'],[.80,'#14102a'],[.845,'#e6f0ff'],[.92,'#7f8fc4'],[1,'#ffffff']];
  let ring='';
  const N=360;
  for(let i=0;i<N;i++){
    const a0=(i/N)*2*Math.PI-0.004, a1=((i+1)/N)*2*Math.PI+0.004;
    const x0=CX+Math.sin(a0)*RR, y0=CY-Math.cos(a0)*RR, x1=CX+Math.sin(a1)*RR, y1=CY-Math.cos(a1)*RR;
    ring+=`<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${RR},${RR} 0 0,1 ${x1.toFixed(2)},${y1.toFixed(2)}" stroke="${sample(stops,i/N)}"/>`;
  }
  // tribal chrome thorns sprouting from the halo (mirrored pairs)
  let th='';
  const sprout=(deg,specs)=>{
    [1,-1].forEach(side=>{
      const t=deg*Math.PI/180*side;
      const bx=CX+Math.sin(t)*RR, by=CY-Math.cos(t)*RR;
      const outward=Math.atan2(by-CY,bx-CX);
      specs.forEach(([dAng,len,w,curl,off])=>{
        const ang=outward+dAng*side;
        th+=`<path d="${thorn(bx+Math.cos(outward)*off, by+Math.sin(outward)*off, ang, len, w, curl*side)}"/>`;
      });
    });
  };
  // big wing at 3 / 9 o'clock: interlocking hooked thorns
  sprout(84,[[-0.55,128,22,-0.62,-10],[-0.05,104,16,0.55,-10],[0.62,70,11,-0.7,-8]]);
  sprout(100,[[0.55,118,20,0.62,-10],[1.1,74,12,-0.6,-8]]);
  // small barbs further round the halo
  sprout(132,[[0.35,66,11,0.6,-8],[-0.35,46,8,-0.6,-6]]);
  sprout(55,[[-0.3,60,10,-0.6,-8]]);

  s+=`<g filter="url(#bevelM)">`+
     `<g fill="url(#chromeBB)">${th}</g>`+
     `<g fill="none" stroke-width="24" stroke-linecap="butt">${ring}</g>`+
     `</g>`;
  // crisp rim lines on the tube
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR+12.5}" fill="none" stroke="#05040a" stroke-width="2"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR-12.5}" fill="none" stroke="#05040a" stroke-width="2"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RR-7}" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".55"/>`;
  $('L_ring').innerHTML=s;

  function crescent(cx,cy,r,thick,rotDeg){
    // thin lit sliver along the upper-right inner edge
    const t=rotDeg*Math.PI/180;
    const ox=Math.cos(t)*thick, oy=Math.sin(t)*thick;
    const a1=-150*Math.PI/180+t+Math.PI/2, a2=60*Math.PI/180+t+Math.PI/2;
    // outer arc points
    const p1=[cx+Math.cos(t-1.25)*r, cy+Math.sin(t-1.25)*r], p2=[cx+Math.cos(t+1.25)*r, cy+Math.sin(t+1.25)*r];
    return `M${f1(p1[0])},${f1(p1[1])} A${r},${r} 0 0,1 ${f1(p2[0])},${f1(p2[1])} A${r*1.04},${r*1.04} 0 0,0 ${f1(p1[0])},${f1(p1[1])}Z`;
  }
})();

/* ---------- wireframe paper lanterns (chōchin) ---------- */
function lantern(cx,cy,w,h,color,glowId,label,tilt=0){
  const rx=w/2, ry=h/2; let s=`<g transform="rotate(${tilt} ${cx} ${cy})">`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx*1.6}" ry="${ry*1.4}" fill="url(#${glowId})"/>`;
  s+=`<g fill="none" stroke="${color}" stroke-width="1.3">`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" stroke-width="2"/>`;
  const ribs=9;
  for(let i=1;i<ribs;i++){
    const y=-ry+i*(2*ry/ribs), k=Math.sqrt(1-(y/ry)**2);
    s+=`<ellipse cx="${cx}" cy="${f1(cy+y)}" rx="${f1(rx*k)}" ry="${f1(rx*k*0.16)}" opacity=".85"/>`;
  }
  [0.25,0.55,0.8].forEach(c=>{ s+=`<ellipse cx="${cx}" cy="${cy}" rx="${f1(rx*c)}" ry="${ry}" opacity=".7"/>`; });
  s+=`<line x1="${cx}" y1="${cy-ry}" x2="${cx}" y2="${cy+ry}" opacity=".7"/>`;
  // caps
  s+=`<rect x="${f1(cx-rx*0.5)}" y="${f1(cy-ry-h*0.07)}" width="${f1(rx)}" height="${f1(h*0.08)}" stroke-width="1.8"/>`;
  s+=`<rect x="${f1(cx-rx*0.5)}" y="${f1(cy+ry-h*0.01)}" width="${f1(rx)}" height="${f1(h*0.08)}" stroke-width="1.8"/>`;
  s+=`<path d="M${f1(cx-rx*0.3)},${f1(cy-ry-h*0.07)} Q${cx},${f1(cy-ry-h*0.26)} ${f1(cx+rx*0.3)},${f1(cy-ry-h*0.07)}"/>`;
  s+=`<path d="M${cx},${f1(cy+ry+h*0.07)} V${f1(cy+ry+h*0.22)} M${cx-4},${f1(cy+ry+h*0.12)} V${f1(cy+ry+h*0.28)} M${cx+4},${f1(cy+ry+h*0.12)} V${f1(cy+ry+h*0.28)}" stroke-width="1"/>`;
  s+=`</g>`;
  if(label) s+=`<text class="cjk" x="${cx}" y="${f1(cy+h*0.17)}" font-size="${f1(h*0.42)}" text-anchor="middle" fill="${color}" filter="url(#glowSoft)">${label}</text>`;
  s+=`</g>`;
  return s;
}
