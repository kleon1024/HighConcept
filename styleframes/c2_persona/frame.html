<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>百鬼夜行 · Style C2</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="../../shape-of-sound/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/zcool-qingke-huangyou/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/zhi-mang-xing/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/anton/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/bebas-neue/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/abril-fatface/400.css">
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0C; }
  #stage { width: 1080px; height: 1920px; overflow: hidden; position: relative; }
  svg { display: block; }
  /* silhouette copies used for white outlines / offset plates */
  .sil * { fill: var(--c) !important; stroke: var(--c) !important; stroke-width: var(--w) !important; stroke-linejoin: miter !important; stroke-miterlimit: 3; }
  .sil clipPath * { stroke-width: 0 !important; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib.js"></script>
<script src="hero.js"></script>
<script>
const { C, poly, P, strand, dots, cracks, splat, cutout, kitsune, oni, hannya, pumpkin, glyph, f1 } = P5K;
const W = 1080, H = 1920;
const TAN = Math.tan(28 * Math.PI / 180); // main plate angle: -28deg

function scene() {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s += `<rect width="${W}" height="${H}" fill="${C.K}"/>`;

  // 1. red band between two -28deg lines (black wedge top-left, black field below)
  const yTop = (x) => 300 - TAN * x, yBot = (x) => 1250 - TAN * x;
  s += poly([[0, yTop(0)], [W, yTop(W)], [W, yBot(W)], [0, yBot(0)]], C.R);
  // halftone fade: black dots growing toward the band's lower edge
  s += `<clipPath id="redClip"><path d="${P([[0, yTop(0)], [W, yTop(W)], [W, yBot(W)], [0, yBot(0)]])}"/></clipPath>`;
  s += `<g clip-path="url(#redClip)">` + dots(0, 560, 520, 1260, 15, 28, (x, y) => {
    const d = yBot(x) - y; return d < 150 && d > -10 ? 6.4 * Math.pow(1 - Math.max(0, d) / 150, 1.3) : 0;
  }, C.K) + `</g>`;
  // light-grey band, parallel, below
  // big light-grey plate (bottom-right), cut by a steep +62deg edge — the "breathing" plate
  const xS = (y) => (1920 - y) / Math.tan(62 * Math.PI / 180);
  const gp = [[xS(986), 986], [W, yBot(W)], [W, H], [0, H]];
  s += poly(gp, C.G1);
  s += `<clipPath id="greyClip"><path d="${P(gp)}"/></clipPath>`;
  s += `<g clip-path="url(#greyClip)">` + dots(300, 900, 1080, 1920, 13, 28, (x, y) => {
    const d = y - yBot(x); return d > -5 && d < 170 ? 5.2 * Math.pow(1 - Math.max(0, d) / 170, 1.2) : 0;
  }, C.G2) + `</g>`;
  // red floor plate bottom-left + ink splat
  s += poly([[0, 1760], [xS(1760), 1760], [xS(1920), H], [0, H]], C.R);
  s += splat(150, 1800, 64, 7, C.K, 14);

  // 2. glass cracks radiating from where the mask was torn away
  s += `<g clip-path="url(#redClip)">` + cracks(440, 690, 9, 200, 700, 5, C.K, 15) + `</g>`;

  // 3. the parade: three masks in lifted shards around the hero
  s += `<g transform="translate(600,196) rotate(-10) scale(0.56)">${cutout(oni(), { outline: 26, shadow: [22, 22] })}</g>`;
  s += `<g transform="translate(894,250) rotate(12) scale(0.54)">${cutout(hannya(), { outline: 26, shadow: [22, 22] })}</g>`;
  s += `<g transform="translate(960,1066) rotate(8) scale(0.42)">${cutout(pumpkin(), { outline: 30, shadow: [26, 26], shadowColor: C.R })}</g>`;

  // 4. the hero (cut-out with white outline and red offset plate)
  const HX = 650, HY = 720;
  const heroInner = `<g transform="translate(${HX},${HY})">${P5H.body()}${P5H.arm()}<g transform="rotate(-5)">${P5H.head()}</g></g>`;
  s += cutout(heroInner, { outline: 22, shadow: [20, 14], shadowColor: C.R });
  // mask cord (black-cased red) from the mask to behind the head
  const cord = 'M-266,-293 C-200,-430 -40,-440 70,-366';
  s += `<g transform="translate(${HX},${HY})"><path d="${cord}" fill="none" stroke="${C.K}" stroke-width="18" stroke-linecap="round"/><path d="${cord}" fill="none" stroke="${C.R}" stroke-width="8" stroke-linecap="round"/></g>`;
  // the kitsune mask, then the gloved hand over its chin
  const mask = `<g transform="translate(260,530) rotate(-18)">${kitsune()}</g>`;
  s += cutout(mask, { outline: 16, shadow: [18, 18], shadowColor: C.K });
  s += `<g transform="translate(${HX},${HY})">${cutout(P5H.hand(), { outline: 12 })}</g>`;

  // 5. type
  s += dateStamp();
  s += titleColumn();
  s += slogan();
  s += `</svg>`;
  return s;
}

function shard(pts, fill, content) {
  const id = 'sh' + Math.round(pts[0][0] + pts[0][1]);
  let s = poly(pts.map((p) => [p[0] + 16, p[1] + 16]), C.K);
  s += poly(pts, fill, `stroke="${C.W}" stroke-width="12" stroke-linejoin="miter"`);
  s += `<clipPath id="${id}"><path d="${P(pts)}"/></clipPath><g clip-path="url(#${id})">${content()}</g>`;
  return s;
}

function dateStamp() {
  let s = '';
  s += glyph('10', { x: 130, y: 128, size: 100, font: "'Anton'", weight: 400, fill: C.R, stroke: C.W, strokeW: 10, rot: -8, tshadow: [7, 7], tshadowColor: C.K, ls: -4 });
  s += glyph('31', { x: 228, y: 140, size: 76, font: "'Anton'", weight: 400, fill: C.W, stroke: C.K, strokeW: 9, rot: 6, tshadow: [6, 6], tshadowColor: C.R });
  s += glyph('SAT', { x: 236, y: 196, size: 30, font: "'Bebas Neue'", weight: 400, fill: C.K, bg: C.W, tw: 70, th: 34, rot: -10, skew: -12 });
  s += glyph('子时', { x: 128, y: 206, size: 34, font: "'Noto Serif SC'", fill: C.W, bg: C.K, border: C.W, borderW: 5, tw: 88, th: 46, rot: -4, skew: -10 });
  return s;
}

function titleColumn() {
  let s = '';
  // thin vertical strip (romanised title) beside the column
  s += `<g transform="translate(372,1360) rotate(-90)"><text font-family="'Bebas Neue'" font-size="40" fill="${C.W}" letter-spacing="5">HYAKKI YAKŌ · NIGHT PARADE · 10.31</text></g>`;
  s += glyph('百', { x: 178, y: 900, size: 176, font: "'Noto Serif SC'", fill: C.K, bg: C.W, rot: -7, shadow: [14, 14], shadowColor: C.R, tw: 196, th: 196 });
  s += glyph('鬼', { x: 196, y: 1108, size: 252, font: "'Noto Sans SC'", fill: C.R, stroke: C.W, strokeW: 16, rot: 5, tshadow: [12, 12], tshadowColor: C.K });
  s += glyph('夜', { x: 160, y: 1320, size: 168, font: "'ZCOOL QingKe HuangYou'", weight: 400, fill: C.W, bg: C.K, border: C.W, borderW: 8, rot: -4, tw: 190, th: 190 });
  s += glyph('行', { x: 212, y: 1494, size: 160, font: "'Noto Serif SC'", fill: C.W, bg: C.R, rot: 7, shadow: [14, 14], shadowColor: C.K, tw: 184, th: 184 });
  return s;
}

function slogan() {
  // 今夜，摘下面具 — set along -12deg across the chest
  const a = -12 * Math.PI / 180, ox = 392, oy = 1548;
  const at = (d) => [ox + Math.cos(a) * d, oy + Math.sin(a) * d];
  let s = '';
  // anchor plate: black skew bar with red offset
  s += `<g transform="translate(${ox - 40},${oy}) rotate(-12)"><rect x="0" y="-62" width="660" height="124" fill="${C.R}" transform="translate(16,14) skewX(-18)"/><rect x="0" y="-62" width="660" height="124" fill="${C.K}" stroke="${C.W}" stroke-width="6" transform="skewX(-18)"/></g>`;
  const G = [
    ['今', 30, { size: 88, font: "'Noto Serif SC'", fill: C.K, bg: C.W, rot: -6, tw: 104, th: 104 }],
    ['夜', 124, { size: 92, font: "'Noto Sans SC'", fill: C.W, rot: 4 }],
    ['，', 188, { size: 90, font: "'Noto Sans SC'", fill: C.R, rot: 0, dy: -10 }],
    ['摘', 270, { size: 118, font: "'Noto Sans SC'", fill: C.W, bg: C.R, rot: 6, tw: 132, th: 132, shadow: [10, 10], shadowColor: C.W }],
    ['下', 380, { size: 86, font: "'ZCOOL QingKe HuangYou'", weight: 400, fill: C.K, bg: C.W, rot: -2, tw: 104, th: 104 }],
    ['面', 474, { size: 96, font: "'Noto Serif SC'", fill: C.W, rot: 3 }],
    ['具', 568, { size: 90, font: "'Noto Sans SC'", fill: C.K, bg: C.G1, rot: -5, tw: 106, th: 106 }],
  ];
  G.forEach(([ch, d, o]) => { const p = at(d); s += glyph(ch, Object.assign({ x: p[0], y: p[1] }, o, { rot: -12 + (o.rot || 0) })); });
  return s;
}

(async () => {
  const fams = ["900 40px 'Noto Serif SC'", "900 40px 'Noto Sans SC'", "40px 'ZCOOL QingKe HuangYou'", "40px 'Anton'", "40px 'Bebas Neue'"];
  const txt = '百鬼夜行今摘下面具子时，10 31 SAT HYAKKI YAKŌ NIGHT PARADE OF A HUNDRED DEMONS';
  await Promise.all(fams.map((f) => document.fonts.load(f, txt)));
  document.getElementById('stage').innerHTML = scene();
  await document.fonts.ready;
  window.__ready = true;
})();
</script>
</body>
</html>
