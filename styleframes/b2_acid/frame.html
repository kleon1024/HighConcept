// tapered tube along a curve -> chrome thorns, barbs
function taperTube(curve, { segs = 140, radial = 28, r0 = 16, pow = 1.15, flat = 0.62, tip = 0.25 } = {}) {
  const frames = curve.computeFrenetFrames(segs, false);

    const s = i / segs, p = curve.getPointAt(s), N = frames.normals[i], B = frames.binormals[i];
    const r = r0 * Math.pow(1 - s, pow) + tip;

      const a = j / radial * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a);

      uv.push(j / radial, s);

  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;

// opentype glyph -> THREE.Shape[] (outer/hole detection by signed area + containment)
function glyphShapes(font, ch, size) {
  const path = font.getPath(ch, 0, 0, size);
  const contours = []; let cur = null;
  for (const c of path.commands) {
    if (c.type === 'M') { cur = new THREE.Path(); cur.moveTo(c.x, -c.y); contours.push(cur); }
    else if (c.type === 'L') cur.lineTo(c.x, -c.y);
    else if (c.type === 'Q') cur.quadraticCurveTo(c.x1, -c.y1, c.x, -c.y);
    else if (c.type === 'C') cur.bezierCurveTo(c.x1, -c.y1, c.x2, -c.y2, c.x, -c.y);
  }
  const info = contours.map(p => { const pts = p.getPoints(12); return { p, pts, area: THREE.ShapeUtils.area(pts) }; })
    .filter(o => Math.abs(o.area) > 1);
  const big = info.reduce((a, b) => Math.abs(b.area) > Math.abs(a.area) ? b : a);
  const outerSign = Math.sign(big.area);
  const inside = (pt, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; };

  for (const h of info.filter(o => Math.sign(o.area) !== outerSign)) {
    const host = outers.filter(O => inside(h.pts[0], O.o.pts)).sort((a, b) => Math.abs(a.o.area) - Math.abs(b.o.area))[0];

// 3. hero: chrome speaker, slashed (Dave Davies, 1964) + thorns + waveform

function buildThorns() {
  const g = new THREE.Group();

    [50, 300, 34, 0.85, true], [76, 210, 24, 0.75, true], [25, 150, 18, 0.7, false], [-40, 180, 24, 0.8, true], [-66, 110, 15, 0.7, false],

    const base = dir.clone().multiplyScalar(300);
    const p0 = base.clone().setZ(-18);
    const p1 = base.clone().addScaledVector(dir, L * 0.38).addScaledVector(nrm, -L * 0.12 * bend).setZ(-8);
    const p2 = base.clone().addScaledVector(dir, L * 0.72).addScaledVector(nrm, L * 0.22 * bend).setZ(4);
    const p3 = base.clone().addScaledVector(dir, L).addScaledVector(nrm, L * 0.52 * bend).setZ(10);
    const curve = new THREE.CubicBezierCurve3(p0, p1, p2, p3);
    g.add(new THREE.Mesh(taperTube(curve, { r0, pow: 1.25, flat: 0.62 }), mat));
    if (barb) {
      const q0 = curve.getPointAt(0.34), t0 = curve.getTangentAt(0.34);
      const out = new THREE.Vector3(-t0.y, t0.x, 0).multiplyScalar(-side * Math.sign(deg));
      const q1 = q0.clone().addScaledVector(out, L * 0.16).addScaledVector(t0, -L * 0.02);
      const q2 = q0.clone().addScaledVector(out, L * 0.25).addScaledVector(t0, -L * 0.14).setZ(q0.z + 6);
      g.add(new THREE.Mesh(taperTube(new THREE.QuadraticBezierCurve3(q0, q1, q2), { r0: r0 * 0.55, pow: 1.0, flat: 0.6, segs: 60 }), mat));
    }
  }
  return g;
}

function buildWave() {
  const g = new THREE.Group();
  const mat = chrome({ roughness: 0.05 });
  const A = 64, k = Math.PI * 2 / 150;
  const mk = (x0, x1, G, z) => {
    const pts = [];
    for (let x = x0; x <= x1; x += 2) { const s = Math.sin(k * (x + 18)); const y = G < 0.5 ? A * s : A * Math.tanh(G * s) / Math.tanh(G); pts.push(new THREE.Vector3(x, y, z)); }
    return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.0), pts.length * 3, 5.2, 16, false), mat);
  };
  g.add(mk(-700, -318, 0.0, -22));   // clean sine in
  g.add(mk(318, 700, 9.0, -22));     // clipped square out
  return g;
}

// =====================================================================
// 4. chrome type 「失真」 (Noto Serif SC 900, extruded + bevelled)
// =====================================================================
async function buildTitle() {
  // fontsource WOFF subsets, unpacked to OTF by tools/woff2otf.js (opentype.js's inflate rejects one of them)
  const fA = await opentype.load('./fonts/noto-serif-sc-115-900.otf');   // 失
  const fB = await opentype.load('./fonts/noto-serif-sc-117-900.otf');   // 真
  const size = 286, gap = 18;
  const gA = glyphShapes(fA, '失', size), gB = glyphShapes(fB, '真', size);
  const opts = { depth: 44, bevelEnabled: true, bevelThickness: 12, bevelSize: 6.5, bevelSegments: 8, curveSegments: 16 };
  const g = new THREE.Group();
  const mat = chrome({ roughness: 0.035, envMap: SKY }, [0.2, 1 / 210, 0.25]);
  const mA = new THREE.Mesh(new THREE.ExtrudeGeometry(gA.shapes, opts), mat);
  const mB = new THREE.Mesh(new THREE.ExtrudeGeometry(gB.shapes, opts), mat);
  mB.position.x = gA.advance + gap;
  g.add(mA, mB);
  const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3());
  g.children.forEach(m => m.position.sub(new THREE.Vector3(c.x, c.y, box.max.z)));
  return g;
}

function drawUnder() {
  const s = document.getElementById('under');

  const rg = el(defs, 'radialGradient', { id: 'haze', cx: '50%', cy: '46%', r: '55%' });
  el(rg, 'stop', { offset: '0', 'stop-color': '#2a2b2e', 'stop-opacity': '1' });
  el(rg, 'stop', { offset: '0.55', 'stop-color': '#0d0d0f', 'stop-opacity': '1' });
  el(rg, 'stop', { offset: '1', 'stop-color': '#050506', 'stop-opacity': '1' });
  el(s, 'rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#haze)' });
  const blur = el(defs, 'filter', { id: 'soft', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  el(blur, 'feGaussianBlur', { stdDeviation: 70 });
  el(s, 'ellipse', { cx: 600, cy: 900, rx: 240, ry: 90, fill: '#c8ff1e', opacity: 0.07, filter: 'url(#soft)', transform: 'rotate(-38 600 900)' });
  // 12-column layout grid (70 margin, 940 content, 12 cols)
  const gG = el(s, 'g', { stroke: '#ffffff', 'stroke-opacity': 0.055, 'stroke-width': 1 });
  for (let i = 0; i <= 12; i++) { const x = 70 + i * (940 / 12); el(gG, 'line', { x1: x, y1: 0, x2: x, y2: H }); }
  for (let y = 160; y < H; y += 160) el(gG, 'line', { x1: 0, y1: y, x2: W, y2: y });
  // headline, flat, clipped like a waveform hitting the rails
  const clip = el(defs, 'clipPath', { id: 'rails' });
  const TOP = 222, BOT = 404;
  el(clip, 'rect', { x: 0, y: TOP, width: W, height: BOT - TOP });
  const t = el(s, 'text', { x: 70, y: 430, 'font-family': "'Big Shoulders Display'", 'font-weight': 900, 'font-size': 318,
    textLength: 940, lengthAdjust: 'spacingAndGlyphs', fill: '#c3c4c7', 'clip-path': 'url(#rails)', 'letter-spacing': '-2' }, 'DISTORTION');
  // ghost of what was clipped off (hairline outline outside the rails)
  const clipOut = el(defs, 'clipPath', { id: 'outside' });
  el(clipOut, 'rect', { x: 0, y: 150, width: W, height: TOP - 150 });
  el(clipOut, 'rect', { x: 0, y: BOT, width: W, height: 60 });
  el(s, 'text', { x: 70, y: 430, 'font-family': "'Big Shoulders Display'", 'font-weight': 900, 'font-size': 318,
    textLength: 940, lengthAdjust: 'spacingAndGlyphs', fill: 'none', stroke: '#e6e7e9', 'stroke-opacity': 0.35, 'stroke-width': 1.2, 'clip-path': 'url(#outside)', 'letter-spacing': '-2' }, 'DISTORTION');
  // the rails
  el(s, 'line', { x1: 70, y1: TOP, x2: 1010, y2: TOP, stroke: '#c8ff1e', 'stroke-width': 2 });
  el(s, 'line', { x1: 70, y1: BOT, x2: 1010, y2: BOT, stroke: '#c8ff1e', 'stroke-width': 2 });
  return { TOP, BOT };
}

  // slash callout with leader
  el(s, 'path', { d: 'M742 1040 L812 1110 H1010', stroke: '#e6e7e9', 'stroke-opacity': 0.7, fill: 'none', 'stroke-width': 1 });

  // left vertical spine text
  const v = el(s, 'text', { x: 0, y: 0, 'font-size': 11, fill: '#7d7e81', 'letter-spacing': '3', transform: 'translate(44 1180) rotate(-90)' }, 'BROKEN SPEAKERS — FUZZ — OVERDRIVE — 1951 → 1964');
  // footer (bottom 300 px: micro-type only)
  const fy = 1700;
  el(s, 'line', { x1: 70, y1: fy - 40, x2: 1010, y2: fy - 40, stroke: '#ffffff', 'stroke-opacity': 0.25 });
  const stops = [[70, '1951', 'ROCKET 88', 'AMP FELL · CONE BURST'], [305, '1958', 'RUMBLE', 'PENCIL HOLES'], [540, '1962', 'FZ-1', 'FIRST FUZZ BOX'], [775, '1964', 'YOU REALLY GOT ME', 'RAZOR · CONE']];
  stops.forEach(([x, y1, a, b], i) => {
    el(s, 'line', { x1: x, y1: fy - 40, x2: x, y2: fy - 28, stroke: i === 3 ? '#c8ff1e' : '#e6e7e9', 'stroke-width': 2 });
    mono(x, fy - 6, y1, { fill: i === 3 ? '#c8ff1e' : '#e6e7e9', 'font-weight': 700, 'font-size': 15 });
    mono(x, fy + 14, a, { 'font-size': 11 });
    mono(x, fy + 30, b, { 'font-size': 10, fill: '#7d7e81' });
  });
  // tick ruler
  const tg = el(s, 'g', { stroke: '#8d8e91', 'stroke-width': 1 });
  for (let i = 0; i <= 94; i++) { const x = 70 + i * 10; el(tg, 'line', { x1: x, y1: 1790, x2: x, y2: 1790 + (i % 10 === 0 ? 14 : i % 5 === 0 ? 9 : 5) }); }
  mono(70, 1832, 'STYLE FRAME B2 · ACID GRAPHICS · 1080×1920', { 'font-size': 10, fill: '#6c6d70' });
  mono(1010, 1832, '失真 · DISTORTION', { 'font-size': 10, fill: '#6c6d70', 'text-anchor': 'end', 'font-family': "'JetBrains Mono','Noto Serif SC'" });
  return { s, glint: (x, y, r, rot = 0, op = 1) => {
    const k = 0.11;
    el(s, 'path', { d: `M0 ${-r} L${r * k} ${-r * k} L${r} 0 L${r * k} ${r * k} L0 ${r} L${-r * k} ${r * k} L${-r} 0 L${-r * k} ${-r * k} Z`, fill: '#ffffff', opacity: op, filter: 'url(#glint)', transform: `translate(${x} ${y}) rotate(${rot})` });
  } };
}

function drawGrain(seed = 7) {
  const c = document.getElementById('grain'), ctx = c.getContext('2d'), img = ctx.createImageData(W, H), rnd = mulberry32(seed);
  for (let i = 0; i < W * H; i++) { const v = 128 + (rnd() + rnd() + rnd() - 1.5) * 70; const o = i * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255; }
  ctx.putImageData(img, 0, 0);
}

// cheap, controllable bloom: threshold the GL frame at 1/4 res, blur, screen on top
function bloom(strength = 0.6, thresh = 0.86) {
  const q = 4, w = W / q, h = H / q;
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const t = tmp.getContext('2d'); t.drawImage(canvas, 0, 0, w, h);
  const d = t.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) {
    const al = a[i + 3] / 255, l = (0.2126 * a[i] + 0.7152 * a[i + 1] + 0.0722 * a[i + 2]) / 255;
    const k = Math.max(0, (l - thresh) / (1 - thresh)) * al;
    a[i] *= k; a[i + 1] *= k; a[i + 2] *= k; a[i + 3] = 255;
  }
  t.putImageData(d, 0, 0);
  const out = document.getElementById('bloom').getContext('2d');
  out.clearRect(0, 0, W, H); out.globalAlpha = strength;
  out.filter = 'blur(10px)'; out.drawImage(tmp, 0, 0, W, H);
  out.filter = 'blur(34px)'; out.drawImage(tmp, 0, 0, W, H);
  out.filter = 'none'; out.globalAlpha = 1;
  // faint chromatic fringe on chrome edges (red pulled left, blue pushed right)
  // (only the difference between a channel and its shifted copy -> edges only, no overall tint)
  for (const [col, dx] of [['#ff0000', -2.5], ['#0000ff', 2.5]]) {
    const ch = document.createElement('canvas'); ch.width = W; ch.height = H; const xc = ch.getContext('2d');
    xc.fillStyle = '#000'; xc.fillRect(0, 0, W, H); xc.drawImage(canvas, 0, 0);
    xc.globalCompositeOperation = 'multiply'; xc.fillStyle = col; xc.fillRect(0, 0, W, H);
    const e = document.createElement('canvas'); e.width = W; e.height = H; const xe = e.getContext('2d');
    xe.drawImage(ch, 0, 0); xe.globalCompositeOperation = 'difference'; xe.drawImage(ch, dx, 0);
    out.globalAlpha = 0.45; out.drawImage(e, 0, 0); out.globalAlpha = 1;
  }
}

// =====================================================================
// 6. assemble + renderAt(t)
// =====================================================================
const hero = new THREE.Group();
const speaker = buildSpeaker(1);
const thorns = buildThorns();
const wave = buildWave();
hero.add(speaker, thorns, wave);
const hp = P(SPK.cx, SPK.cy);
hero.position.copy(hp);
hero.rotation.set(-0.16, 0.24, 0.0);
scene.add(hero);

const title = await buildTitle();
title.position.copy(P(540, 1392)).setZ(40);
title.rotation.set(-0.11, 0.0, 0);
scene.add(title);

const rails = drawUnder();
const over = drawOver(rails);
drawGrain();

window.renderAt = (t = 0) => {
  renderer.render(scene, camera);
  bloom();
};

await document.fonts.ready;

over.glint(271, 666, 34, 0, 0.95);
over.glint(842, 600, 22, 0, 0.85);
over.glint(668, 1292, 26, 0, 0.9);
window.__ready = true;
