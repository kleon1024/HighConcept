<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>百鬼夜行 · Style A</title>
<style>
@import url("node_modules/@fontsource/ma-shan-zheng/index.css");
@import url("node_modules/@fontsource/noto-serif-sc/400.css");
@import url("node_modules/@fontsource/noto-serif-sc/700.css");
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#0B0326}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage>svg{position:absolute;left:0;top:0}
.title{position:absolute;right:66px;top:120px;writing-mode:vertical-rl;font-family:'Ma Shan Zheng',serif;
  font-size:176px;line-height:1;letter-spacing:-10px;white-space:nowrap}
.title.back{color:#1A0640;-webkit-text-stroke:16px #1A0640;
  text-shadow:0 0 30px rgba(255,46,154,.85),0 0 70px rgba(255,138,31,.55),0 0 120px rgba(107,43,217,.7)}
.title.front{background:linear-gradient(180deg,#FFFFFF 0%,#FFF1C2 22%,#FFD25A 48%,#FF8A1F 78%,#FF2E9A 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.latin{position:absolute;right:262px;top:150px;writing-mode:vertical-rl;font-family:'Noto Serif SC',serif;font-weight:700;
  font-size:22px;letter-spacing:.42em;color:#BFF7FF;text-shadow:0 0 10px rgba(34,228,255,.9),0 0 2px #0B0326}
.seal{position:absolute;right:92px;top:880px;width:104px;height:104px;background:#E8262B;border-radius:6px;
  box-shadow:0 0 0 3px #FFD25A,0 0 24px rgba(232,38,43,.8);display:grid;grid-template-columns:1fr;place-items:center;
  font-family:'Noto Serif SC',serif;font-weight:700;color:#FFF3E0;font-size:40px;line-height:1;writing-mode:vertical-rl;
  letter-spacing:4px}
.seal i{position:absolute;inset:7px;border:2px solid rgba(255,243,224,.85);border-radius:3px}
.sub{position:absolute;right:270px;top:620px;writing-mode:vertical-rl;font-family:'Noto Serif SC',serif;font-weight:400;
  font-size:24px;letter-spacing:.5em;color:#FFE7F3;text-shadow:0 0 12px rgba(255,46,154,.95)}
</style>
</head>
<body>
<div id="stage">
  <svg id="art" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="title back">百鬼夜行</div>
  <div class="title front">百鬼夜行</div>
  <div class="latin">NIGHT PARADE · 2026</div>
  <div class="seal"><i></i>丙午</div>
</div>
<script>
(function(){
const W=1080,H=1920;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(20261031);
const R=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.floor(rnd()*a.length)];
const f=n=>(+n).toFixed(1);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(c){c=c.replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
function ramp(stops,t){t=clamp(t,0,1);for(let i=0;i<stops.length-1;i++){const[a,ca]=stops[i],[b,cb]=stops[i+1];if(t<=b)return mix(ca,cb,(t-a)/(b-a||1))}return stops[stops.length-1][1]}

const C={night:'#0B0326',indigo:'#1E0A55',violet:'#6B2BD9',magenta:'#FF2E9A',cyan:'#22E4FF',tangerine:'#FF8A1F',gold:'#FFD25A',
  vermilion:'#E8262B',pink:'#FFB3D9',ink:'#14052E',cream:'#FFF4DC'};
const CX=500,CY=640; // megastructure centre

let defs='';const L=[];const add=s=>L.push(s);

/* ---------------- defs ---------------- */
defs+=`
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1920" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#07021E"/><stop offset=".16" stop-color="#170850"/><stop offset=".33" stop-color="#3D1290"/>
  <stop offset=".46" stop-color="#8E1FB0"/><stop offset=".53" stop-color="#E5368F"/><stop offset=".6" stop-color="#FF8A4A"/>
  <stop offset="1" stop-color="#FFC870"/></linearGradient>
<radialGradient id="halo" cx="${CX}" cy="${CY}" r="900" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFE9B0" stop-opacity="1"/><stop offset=".22" stop-color="#FF7AA8" stop-opacity=".75"/>
  <stop offset=".45" stop-color="#B02DD0" stop-opacity=".35"/><stop offset="1" stop-color="#3D1290" stop-opacity="0"/></radialGradient>
<radialGradient id="core" cx="${CX}" cy="${CY+40}" r="270" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset=".28" stop-color="#FFF6CF"/><stop offset=".55" stop-color="#FFC861"/>
  <stop offset=".8" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF2E9A"/></radialGradient>
<radialGradient id="rayFade" cx="${CX}" cy="${CY}" r="1300" gradientUnits="userSpaceOnUse">
  <stop offset=".18" stop-color="#fff" stop-opacity="1"/><stop offset=".75" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="rayMask"><rect width="1080" height="1920" fill="url(#rayFade)"/></mask>
<linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF2E9A"/><stop offset=".6" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFE38A"/></linearGradient>
<linearGradient id="petal2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3B1AA8"/><stop offset=".6" stop-color="#22B8FF"/><stop offset="1" stop-color="#BFFBFF"/></linearGradient>
<linearGradient id="orbitBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset=".35" stop-color="#6B2BD9"/><stop offset=".65" stop-color="#FF2E9A"/><stop offset="1" stop-color="#FFD25A"/></linearGradient>
<linearGradient id="seaGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3A8" stop-opacity=".9"/><stop offset=".35" stop-color="#FF5FA8" stop-opacity=".35"/><stop offset="1" stop-color="#FF5FA8" stop-opacity="0"/></linearGradient>
<radialGradient id="reflect" cx="${CX}" cy="1000" r="520" gradientUnits="userSpaceOnUse" gradientTransform="translate(${CX} 1000) scale(.75 1.6) translate(${-CX} -1000)">
  <stop offset="0" stop-color="#FFF0B8" stop-opacity=".85"/><stop offset=".4" stop-color="#FF7AB0" stop-opacity=".35"/><stop offset="1" stop-color="#FF7AB0" stop-opacity="0"/></radialGradient>
<radialGradient id="lantern" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF8D8"/><stop offset=".35" stop-color="#FFB23A"/><stop offset=".7" stop-color="#FF5A1F" stop-opacity=".55"/><stop offset="1" stop-color="#FF2E9A" stop-opacity="0"/></radialGradient>
<radialGradient id="lanternCyan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2FFFF"/><stop offset=".35" stop-color="#5FF0FF"/><stop offset=".7" stop-color="#2A7BFF" stop-opacity=".5"/><stop offset="1" stop-color="#6B2BD9" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="blur50" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .55"/></feComponentTransfer></filter>
<radialGradient id="vign" cx="540" cy="860" r="1250" gradientUnits="userSpaceOnUse"><stop offset=".55" stop-color="#07021E" stop-opacity="0"/><stop offset="1" stop-color="#07021E" stop-opacity=".85"/></radialGradient>
<linearGradient id="figRim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22E4FF"/><stop offset=".5" stop-color="#FFD25A"/><stop offset="1" stop-color="#FF2E9A"/></linearGradient>
`;
// cloud lobe gradients
const CLOUDS={
  pink:['#FFFFFF','#FFD1EA','#FF6FB8','#9C1670'],
  cyan:['#FFFFFF','#C9FBFF','#45C8FF','#2B2A9E'],
  gold:['#FFFFFF','#FFF0B5','#FFA24A','#B8283E'],
  violet:['#F3E8FF','#C6A4FF','#7A45E0','#2A0E6A'],
};
for(const k in CLOUDS){const c=CLOUDS[k];defs+=`<linearGradient id="cl_${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".35" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient>`;}

/* ---------------- sky ---------------- */
add(`<rect width="1080" height="1920" fill="url(#sky)"/>`);
// psychedelic rays
{let s='';const n=56;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+.5)/n*Math.PI*2;const r=1700;
  s+=`<path d="M${CX},${CY}L${f(CX+r*Math.cos(a0))},${f(CY+r*Math.sin(a0))}L${f(CX+r*Math.cos(a1))},${f(CY+r*Math.sin(a1))}Z" fill="${i%4==0?'#FF2E9A':i%4==2?'#22E4FF':'#FFD25A'}" opacity="${i%2?0:.10}"/>`;}
 add(`<g mask="url(#rayMask)" style="mix-blend-mode:screen">${s}</g>`);}
// concentric op-art ripples
{let s='';for(let r=560,k=0;r<1500;r+=34,k++){s+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="${['#22E4FF','#FF2E9A','#FFD25A','#9B5BFF'][k%4]}" stroke-width="${k%3==0?5:2}" opacity="${f(.22-r/1500*.14)}"/>`;}
 add(`<g style="mix-blend-mode:screen">${s}</g>`);}
// stars
{let s='';for(let i=0;i<360;i++){const x=R(0,W),y=Math.pow(rnd(),1.6)*900;const r=R(.4,1.8);s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${pick(['#FFFFFF','#BFF7FF','#FFE3F2','#FFF1B0'])}" opacity="${f(R(.35,1))}"/>`;}add(`<g filter="url(#glowS)">${s}</g>`);}
// halo
add(`<circle cx="${CX}" cy="${CY}" r="900" fill="url(#halo)" style="mix-blend-mode:screen"/>`);

/* ---------------- megastructure ---------------- */
const ORB={cx:CX,cy:CY-20,rx:600,ry:128,rot:-13};
function orbitArc(half,width,fill,extra=''){ // half: 'back' (upper) or 'front' (lower)
  const {cx,cy,rx,ry,rot}=ORB;const pts=[],pts2=[];const n=90;
  for(let i=0;i<=n;i++){const t=half=='back'?Math.PI+i/n*Math.PI:i/n*Math.PI;
    pts.push([cx+(rx)*Math.cos(t),cy+(ry)*Math.sin(t)]);pts2.push([cx+(rx-width)*Math.cos(t),cy+(ry-width*ry/rx*1.6)*Math.sin(t)]);}
  const d='M'+pts.map(p=>f(p[0])+','+f(p[1])).join('L')+'L'+pts2.reverse().map(p=>f(p[0])+','+f(p[1])).join('L')+'Z';
  return `<g transform="rotate(${rot} ${cx} ${cy})"><path d="${d}" fill="${fill}" ${extra}/></g>`;
}
function orbitDetails(half){
  const {cx,cy,rx,ry,rot}=ORB;let s='';const n=120;
  for(let i=0;i<n;i++){const t=(half=='back'?Math.PI:0)+(i+.5)/n*Math.PI;const x=cx+(rx-18)*Math.cos(t),y=cy+(ry-6)*Math.sin(t);
    s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${i%5==0?2.6:1.3}" fill="${i%5==0?'#FFF4C0':'#BFF7FF'}"/>`;}
  // pavilions riding the ring
  const towers=half=='back'?[1.18,1.42,1.62,1.84]:[0.12,0.3,0.7,0.88];
  for(const tt of towers){const t=tt*Math.PI;const x=cx+(rx-14)*Math.cos(t),y=cy+(ry-4)*Math.sin(t);s+=pagoda(x,y-2,half=='back'?22:30,'#1B0844','#FFD25A',3);}
  return `<g transform="rotate(${rot} ${cx} ${cy})" filter="url(#glowS)">${s}</g>`;
}
function pagoda(x,y,s,fill,light,tiers=4){
  let o='',yy=y;
  for(let k=0;k<tiers;k++){const bw=s*(1-k*.17),bh=s*.42;
    o+=`<rect x="${f(x-bw*.32)}" y="${f(yy-bh*.62)}" width="${f(bw*.64)}" height="${f(bh*.62)}" fill="${fill}"/>`;
    for(let w=-1;w<=1;w++)o+=`<rect x="${f(x+w*bw*.18-bw*.04)}" y="${f(yy-bh*.5)}" width="${f(bw*.08)}" height="${f(bh*.3)}" fill="${light}"/>`;
    const ry=yy-bh*.62;
    o+=`<path d="M${f(x-bw*.72)},${f(ry-bh*.18)}Q${f(x-bw*.5)},${f(ry+bh*.02)} ${f(x-bw*.3)},${f(ry)}L${f(x+bw*.3)},${f(ry)}Q${f(x+bw*.5)},${f(ry+bh*.02)} ${f(x+bw*.72)},${f(ry-bh*.18)}Q${f(x+bw*.4)},${f(ry-bh*.2)} ${f(x)},${f(ry-bh*.5)}Q${f(x-bw*.4)},${f(ry-bh*.2)} ${f(x-bw*.72)},${f(ry-bh*.18)}Z" fill="${fill}"/>`;
    yy=ry-bh*.38;}
  o+=`<rect x="${f(x-s*.03)}" y="${f(yy-s*.5)}" width="${f(s*.06)}" height="${f(s*.5)}" fill="${fill}"/><circle cx="${f(x)}" cy="${f(yy-s*.52)}" r="${f(s*.06)}" fill="${light}"/>`;
  return o;
}
add(orbitArc('back',34,'url(#orbitBand)','opacity=".55"'));
add(orbitArc('back',4,'#FFF4C0','opacity=".7"'));
add(orbitDetails('back'));

// small far islands behind the ring
function island(x,y,w,h,fill,rimc,seed,opts={}){
  const r2=mulberry32(seed);const n=26;const left=[],right=[];
  for(let i=0;i<=n;i++){const t=i/n;const yy=y-h*t;const base=w/2*Math.pow(Math.max(0,1-Math.pow(t,2.3)),.55)*(.78+.22*(1-t));
    left.push([x-base*(1+.10*Math.sin(t*17+seed)+.06*(r2()-.5)),yy]);right.push([x+base*(1+.10*Math.cos(t*13+seed)+.06*(r2()-.5)),yy]);}
  const under=[];const m=12;const dh=h*(opts.under||.42);
  for(let i=0;i<=m;i++){const t=i/m;const xx=x+w/2*(1-2*t)*.98;const yy=y+dh*Math.pow(Math.sin(Math.PI*t),1.3)*(.6+.4*r2())*(i%2?1:.75);under.push([xx,yy]);}
  const pts=left.concat(right.reverse()).concat(under);
  const d='M'+pts.map(p=>f(p[0])+','+f(p[1])).join('L')+'Z';
  const gid='ig'+seed;
  defs+=`<linearGradient id="${gid}" x1="${opts.rimLeft?1:0}" y1="0" x2="${opts.rimLeft?0:1}" y2="0"><stop offset="0" stop-color="${fill}"/><stop offset=".72" stop-color="${fill}"/><stop offset=".93" stop-color="${rimc}"/><stop offset="1" stop-color="${mix(rimc,'#FFFFFF',.5)}"/></linearGradient>`;
  let o=`<path d="${d}" fill="url(#${gid})"/>`;
  // strata lines
  for(let k=0;k<Math.floor(h/24);k++){const t=r2()*.85;const yy=y-h*t;const half=w/2*Math.pow(Math.max(0,1-Math.pow(t,2.3)),.55)*.8;const x0=x-half*R(.2,.9),x1=x+half*R(.2,.9);
    o+=`<path d="M${f(x0)},${f(yy)}Q${f((x0+x1)/2)},${f(yy+R(-6,8))} ${f(x1)},${f(yy+R(-4,4))}" stroke="${rimc}" stroke-width="${f(R(.6,1.6))}" fill="none" opacity="${f(R(.15,.4))}"/>`;}
  if(opts.temple){o+=pagoda(x+(opts.templeDx||0),y-h*.985+ (opts.templeDy||0),opts.temple,fill,'#FFD25A',opts.tiers||4);}
  if(opts.fall){o+=`<path d="M${f(x+w*.12)},${f(y+dh*.5)}L${f(x+w*.12)},${f(y+dh*.5+opts.fall)}" stroke="#E8FDFF" stroke-width="2.4" opacity=".75" filter="url(#glowS)"/>`;}
  return o;
}
add(island(250,560,70,70,'#5A2A9E','#FFB3D9',11,{under:.6,temple:16,tiers:3}));
add(island(790,470,54,52,'#5A2A9E','#FFB3D9',12,{under:.7,temple:12,tiers:3,rimLeft:1}));
add(island(860,380,36,30,'#4A2290','#FFB3D9',13,{under:.7}));

// the great disc
add(`<circle cx="${CX}" cy="${CY}" r="262" fill="url(#core)"/>`);
// inner mandala in the disc
{let s='';for(let r=40;r<255;r+=22)s+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="${r%44?1:2}" opacity=".28"/>`;
 for(let i=0;i<24;i++){const a=i/24*Math.PI*2;s+=`<line x1="${f(CX+40*Math.cos(a))}" y1="${f(CY+40*Math.sin(a))}" x2="${f(CX+255*Math.cos(a))}" y2="${f(CY+255*Math.sin(a))}" stroke="#FFFFFF" stroke-width="1" opacity=".22"/>`;}
 for(let i=0;i<12;i++){const a=i/12*Math.PI*2;s+=`<path d="M${CX},${CY}Q${f(CX+130*Math.cos(a+.35))},${f(CY+130*Math.sin(a+.35))} ${f(CX+240*Math.cos(a))},${f(CY+240*Math.sin(a))}Q${f(CX+130*Math.cos(a-.35))},${f(CY+130*Math.sin(a-.35))} ${CX},${CY}" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity=".3"/>`;}
 add(`<g>${s}</g>`);}
// ring bands
{let s='';
 s+=`<circle cx="${CX}" cy="${CY}" r="266" fill="none" stroke="#FFF1B0" stroke-width="5"/>`;
 // glyph band
 s+=`<circle cx="${CX}" cy="${CY}" r="288" fill="none" stroke="#2A0B6A" stroke-width="38"/>`;
 const ng=64;for(let i=0;i<ng;i++){const a=i/ng*360;let g='';const rr=mulberry32(100+i);
   for(let k=0;k<5;k++){const x0=-7+rr()*14,y0=-12+rr()*24;if(rr()<.5)g+=`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x0+R(4,9)*(rr()<.5?-1:1))}" y2="${f(y0)}"/>`;else g+=`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x0)}" y2="${f(y0+R(4,10))}"/>`;}
   s+=`<g transform="rotate(${f(a)} ${CX} ${CY}) translate(${CX} ${CY-288})" stroke="${i%8==0?'#FF8AC8':'#FFD25A'}" stroke-width="1.8" stroke-linecap="round">${g}</g>`;}
 s+=`<circle cx="${CX}" cy="${CY}" r="309" fill="none" stroke="#22E4FF" stroke-width="3"/>`;
 // lotus petals
 const np=36;for(let i=0;i<np;i++){const a=i/np*360;s+=`<path transform="rotate(${f(a)} ${CX} ${CY})" d="M${CX},${CY-312}C${CX-16},${CY-326} ${CX-14},${CY-350} ${CX},${CY-372}C${CX+14},${CY-350} ${CX+16},${CY-326} ${CX},${CY-312}Z" fill="url(#${i%2?'petal2':'petal'})" stroke="#FFF4C0" stroke-width="1.2"/>`;}
 // tick ring
 s+=`<circle cx="${CX}" cy="${CY}" r="382" fill="none" stroke="#FFD25A" stroke-width="2"/>`;
 for(let i=0;i<240;i++){const a=i/240*Math.PI*2;const l=i%10==0?16:i%5==0?10:5;s+=`<line x1="${f(CX+384*Math.cos(a))}" y1="${f(CY+384*Math.sin(a))}" x2="${f(CX+(384+l)*Math.cos(a))}" y2="${f(CY+(384+l)*Math.sin(a))}" stroke="${i%10==0?'#FFFFFF':'#FFD25A'}" stroke-width="${i%10==0?2:1.2}"/>`;}
 // dot ring
 for(let i=0;i<72;i++){const a=i/72*Math.PI*2;s+=`<circle cx="${f(CX+414*Math.cos(a))}" cy="${f(CY+414*Math.sin(a))}" r="${i%3==0?5:2.5}" fill="${i%3==0?'#22E4FF':'#FF2E9A'}"/>`;}
 s+=`<circle cx="${CX}" cy="${CY}" r="428" fill="none" stroke="#FF2E9A" stroke-width="2" stroke-dasharray="2 8"/>`;
 // city-wall ring: a band of lit windows (sells the megastructure scale)
 s+=`<circle cx="${CX}" cy="${CY}" r="456" fill="none" stroke="#1E0752" stroke-width="26"/>`;
 s+=`<circle cx="${CX}" cy="${CY}" r="443" fill="none" stroke="#FFD25A" stroke-width="1.6"/><circle cx="${CX}" cy="${CY}" r="469" fill="none" stroke="#22E4FF" stroke-width="1.6"/>`;

  for(let i=0;i<Math.floor(n/2);i++){const t=.2+.6*r2();const r=size*(.5+.35*r2());lobes.push([cx+(t-.5)*len*.8,cy-size*.75-r*.3,r]);}
  const outline=opts.outline||mix(CLOUDS[kind][3],'#000000',.15);const lw=opts.lw||Math.max(2,size*.07);
  const bottom=`<rect x="${f(cx-len/2-size*.3)}" y="${f(cy-size*.35)}" width="${f(len+size*.6)}" height="${f(size*.45)}" rx="${f(size*.22)}"`;
  let o='';
  o+=lobes.map(l=>`<circle cx="${f(l[0])}" cy="${f(l[1])}" r="${f(l[2]+lw)}" fill="${outline}"/>`).join('')+bottom+` fill="${outline}" transform="translate(0 ${f(lw)})"/>`;
  o+=bottom+` fill="${CLOUDS[kind][2]}"/>`;
  o+=lobes.map(l=>`<circle cx="${f(l[0])}" cy="${f(l[1])}" r="${f(l[2])}" fill="url(#cl_${kind})"/>`).join('');
  // spirals
  for(const l of lobes){if(l[2]<size*.5)continue;const dir=l[0]<cx?-1:1;let d='';const m=46;const turns=1.6;const a0=r2()*6.28;

    o+=`<path d="${d}" fill="none" stroke="${outline}" stroke-width="${f(lw*.8)}" stroke-linecap="round" opacity=".9"/>`;
    o+=`<path d="M${f(l[0]-l[2]*.55)},${f(l[1]-l[2]*.45)}A${f(l[2]*.75)},${f(l[2]*.75)} 0 0 1 ${f(l[0]+l[2]*.2)},${f(l[1]-l[2]*.72)}" fill="none" stroke="#FFFFFF" stroke-width="${f(lw*.9)}" stroke-linecap="round" opacity=".85"/>`;}
  return `<g ${opts.attr||''}>${o}</g>`;
}

function catmull(P,n){const out=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];

    const env=Math.pow(Math.sin(Math.PI*Math.min(1,t*1.05+.03)),.45);
    const tw=Math.cos(twist*t*Math.PI*2+phase);const wa=W0*env*tw;
    const t2=(i+1)/(n-1);const env2=Math.pow(Math.sin(Math.PI*Math.min(1,t2*1.05+.03)),.45);const wb=W0*env2*Math.cos(twist*t2*Math.PI*2+phase);
    const c=b; const dx2=(pts[Math.min(n-1,i+2)][0]-b[0]),dy2=(pts[Math.min(n-1,i+2)][1]-b[1]);const l2=Math.hypot(dx2,dy2)||1;const nx2=-dy2/l2,ny2=dx2/l2;
    const col=tw>=0?ramp(front,t):ramp(back,t);
    const q=[[a[0]+nx*wa/2,a[1]+ny*wa/2],[b[0]+nx2*wb/2,b[1]+ny2*wb/2],[b[0]-nx2*wb/2,b[1]-ny2*wb/2],[a[0]-nx*wa/2,a[1]-ny*wa/2]];
    o+=`<path d="M${q.map(p=>f(p[0])+','+f(p[1])).join('L')}Z" fill="${col}" stroke="${col}" stroke-width=".8"/>`;
    e+=`<line x1="${f(q[0][0])}" y1="${f(q[0][1])}" x2="${f(q[1][0])}" y2="${f(q[1][1])}" stroke="#FFF4DC" stroke-width="1.1" opacity=".75"/>`;
  }
  return o+e;
}
