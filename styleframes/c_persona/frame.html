<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>百鬼夜行 Style C</title>
<link rel="stylesheet" href="../../shape-of-sound/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../../shape-of-sound/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/anton/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/bebas-neue/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/oswald/700.css">
<style>
  :root {
    --red: #E60012;
    --blk: #0B0B0B;
    --wht: #FFFFFF;
    --acc: #FFD400; /* the single tiny accent */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--red); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--red); }
  svg.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  .abs { position: absolute; }

  /* ---------- ransom-note pieces ---------- */
  .piece { position: absolute; transform-origin: 50% 50%; }
  .piece .plate { position: absolute; inset: 0; }
  .piece .glyph {
    position: relative; display: flex; align-items: center; justify-content: center;
    line-height: 1; white-space: nowrap;
  }
  .sans9 { font-family: 'Noto Sans SC'; font-weight: 900; }
  .sans7 { font-family: 'Noto Sans SC'; font-weight: 700; }
  .serif9 { font-family: 'Noto Serif SC'; font-weight: 900; }
  .serif7 { font-family: 'Noto Serif SC'; font-weight: 700; }
  .anton { font-family: 'Anton'; font-weight: 400; }
  .bebas { font-family: 'Bebas Neue'; font-weight: 400; }
  .oswald { font-family: 'Oswald'; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <!-- L0: background panels, burst, moon, sky details -->
  <svg class="layer" id="bg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="d1"/>
        <feFlood flood-color="#fff"/><feComposite in2="d1" operator="in" result="white"/>
        <feOffset in="d1" dx="18" dy="16" result="d2"/>
        <feFlood flood-color="#0B0B0B"/><feComposite in2="d2" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="stickerS" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d1"/>
        <feFlood flood-color="#fff"/><feComposite in2="d1" operator="in" result="white"/>
        <feOffset in="d1" dx="10" dy="9" result="d2"/>
        <feFlood flood-color="#0B0B0B"/><feComposite in2="d2" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="shadowOnly" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feOffset in="SourceAlpha" dx="14" dy="14" result="o"/>
        <feFlood flood-color="#0B0B0B"/><feComposite in2="o" operator="in" result="s"/>
        <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="toneK" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <circle cx="4.5" cy="4.5" r="2.1" fill="#0B0B0B"/>
      </pattern>
      <pattern id="toneW" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <circle cx="5" cy="5" r="2.2" fill="#fff"/>
      </pattern>
      <pattern id="toneR" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <circle cx="5" cy="5" r="2.6" fill="#E60012"/>
      </pattern>
      <pattern id="hatchK" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
        <rect width="12" height="4" fill="#0B0B0B"/>
      </pattern>
      <pattern id="hatchW" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
        <rect width="14" height="3" fill="#fff"/>
      </pattern>
    </defs>
    <g id="bgRoot"></g>
  </svg>

  <!-- L1: hero figure + oni mask -->
  <svg class="layer" id="mid" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g id="midRoot"></g></svg>

  <!-- L2: typography -->
  <div id="type" class="abs" style="left:0;top:0;width:1080px;height:1920px;"></div>

  <!-- L3: foreground: parade strip, shards -->
  <svg class="layer" id="fg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g id="fgRoot"></g></svg>

  <!-- L4: top typography (over fg) -->
  <div id="type2" class="abs" style="left:0;top:0;width:1080px;height:1920px;"></div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const RED = '#E60012', BLK = '#0B0B0B', WHT = '#FFFFFF', ACC = '#FFD400';

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// deterministic RNG
let _s = 20261031;
function rnd() { _s |= 0; _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const P = (pts) => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';

// polygon with torn / jagged edges. pts: [x,y,amp] amp applies to edge starting there
function torn(pts, step = 16) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const amp = a[2] || 0;
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;
    const segs = amp ? Math.max(1, Math.round(len / step)) : 1;
    for (let j = 0; j < segs; j++) {
      const t = j / segs;
      const jit = j === 0 ? 0 : (rnd() - 0.5) * 2 * amp;
      const tj = j === 0 ? 0 : (rnd() - 0.5) * 0.4 / segs;
      out.push([a[0] + dx * (t + tj) + nx * jit, a[1] + dy * (t + tj) + ny * jit]);
    }
  }
  return P(out);
}
// tapered limb polygon along polyline
function limb(pts, ws) {
  const L = [], Rr = [];
  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(pts.length - 1, i + 1)];
    let dx = p1[0] - p0[0], dy = p1[1] - p0[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const nx = -dy, ny = dx, w = ws[i] / 2;
    L.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
    Rr.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  return P(L.concat(Rr.reverse()));
}
// spiky star / burst
function burst(cx, cy, n, r1, r2, rot = 0, jit = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = rot + (i / (n * 2)) * Math.PI * 2;
    const r = (i % 2 ? r2 : r1) * (1 + (rnd() - 0.5) * jit);
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return P(pts);
}
// variable-size halftone on a 45deg lattice; fn(x,y)->0..1
function halftone(g, { x0, y0, x1, y1, step = 18, rmax = 8, ang = Math.PI / 4, fn, fill }) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, half = Math.hypot(x1 - x0, y1 - y0) / 2 + step;
  const n = Math.ceil(half / step);
  let d = '';
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const x = cx + (i * ca - j * sa) * step, y = cy + (i * sa + j * ca) * step;
    if (x < x0 - step || x > x1 + step || y < y0 - step || y > y1 + step) continue;
    const f = fn(x, y); if (f <= 0.04) continue;
    const r = rmax * Math.min(1, f);
    d += `M${(x - r).toFixed(1)},${y.toFixed(1)}a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(2 * r).toFixed(1)},0a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(-2 * r).toFixed(1)},0`;
  }
  return el('path', { d, fill }, g);
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
let clipN = 0;
function clipTo(d, parent) {
  const id = 'c' + (clipN++);
  const defs = document.querySelector('#bg defs');
  const cp = el('clipPath', { id }, defs); el('path', { d }, cp);
  return `url(#${id})`;
}

/* ====================================================================
   L0  BACKGROUND
   ==================================================================== */
const bg = document.getElementById('bgRoot');

// radial burst rays from behind the hero
(function rays() {
  const cx = 560, cy = 700, g = el('g', {}, bg);
  const N = 44;
  for (let i = 0; i < N; i++) {
    if (i % 2) continue;
    const a0 = (i / N) * Math.PI * 2 + 0.05, a1 = ((i + 1) / N) * Math.PI * 2 + 0.05 + R(-0.02, 0.03);
    el('path', { d: P([[cx, cy], [cx + Math.cos(a0) * 2400, cy + Math.sin(a0) * 2400], [cx + Math.cos(a1) * 2400, cy + Math.sin(a1) * 2400]]), fill: BLK, opacity: 0.16 }, g);
  }
})();

// black halftone in red middle zone (from left & right edges)
halftone(bg, { x0: 0, y0: 560, x1: 1080, y1: 1200, step: 20, rmax: 9.5,
  fn: (x, y) => clamp(1.1 - Math.hypot(x - 1080, y - 1150) / 520) + clamp(0.9 - Math.hypot(x, y - 1050) / 380), fill: BLK });

// SKY panel (black) with a torn lower edge + white paper under-layer
const skyPts = [[0, 0, 0], [1080, 0, 0], [1080, 545, 14], [0, 905, 0]];
const skyUnder = torn([[0, 0, 0], [1080, 0, 0], [1080, 572, 18], [0, 935, 0]], 22);
el('path', { d: skyUnder, fill: WHT }, bg);
const skyD = torn(skyPts, 18);
el('path', { d: skyD, fill: BLK }, bg);
// red halftone rising toward torn edge (screen-tone sky)
(function () {
  const g = el('g', { 'clip-path': clipTo(skyD) }, bg);
  halftone(g, { x0: 0, y0: 200, x1: 1080, y1: 920, step: 17, rmax: 7.8,
    fn: (x, y) => { const edge = 905 - (x / 1080) * 360; return clamp(1 - (edge - y) / 330); }, fill: RED });
  // diagonal hatch slashes in sky
  for (let i = 0; i < 7; i++) {
    const x = R(-100, 900), y = R(40, 520), w = R(140, 420);
    el('path', { d: P([[x, y], [x + w, y - w * 0.32], [x + w, y - w * 0.32 + R(3, 7)], [x, y + R(3, 7)]]), fill: WHT, opacity: 0.85 }, g);
  }
})();

// stars (4-point sparkles)
function sparkle(g, x, y, s, fill = WHT) {
  el('path', { d: `M${x},${y - s}L${x + s * 0.22},${y - s * 0.22}L${x + s},${y}L${x + s * 0.22},${y + s * 0.22}L${x},${y + s}L${x - s * 0.22},${y + s * 0.22}L${x - s},${y}L${x - s * 0.22},${y - s * 0.22}Z`, fill }, g);
}
[[120, 420, 16], [470, 120, 12], [560, 300, 20], [300, 90, 9], [990, 640, 14], [640, 470, 10], [210, 560, 9], [395, 470, 13]].forEach(s => sparkle(bg, ...s));

// MOON: fat crescent, white with red halftone terminator + black slash
(function moon() {
  const cx = 848, cy = 318, r = 236;
  const defs = document.querySelector('#bg defs');
  const m = el('mask', { id: 'moonMask', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1080, height: 1920 }, defs);
  el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: '#000' }, m);
  el('circle', { cx, cy, r, fill: '#fff' }, m);
  el('circle', { cx: cx - 128, cy: cy - 92, r: 212, fill: '#000' }, m);
  // offset paper shadow
  const sh = el('g', { mask: 'url(#moonMask)', transform: 'translate(16,14)' }, bg);
  el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: RED }, sh);
  const g = el('g', { mask: 'url(#moonMask)' }, bg);
  el('circle', { cx, cy, r, fill: WHT }, g);
  halftone(g, { x0: cx - r, y0: cy - r, x1: cx + r, y1: cy + r, step: 13, rmax: 6.4,
    fn: (x, y) => clamp(1 - (Math.hypot(x - (cx - 128), y - (cy - 92)) - 212) / 120), fill: RED });
  // crater cut shapes
  el('circle', { cx: cx + 120, cy: cy + 120, r: 26, fill: 'url(#toneK)' }, g);
  el('circle', { cx: cx + 175, cy: cy + 30, r: 14, fill: 'url(#toneK)' }, g);
})();

// lantern string across the sky
function lantern(g, x, y, s, label, opt = {}) {
  const lg = el('g', { transform: `translate(${x},${y}) rotate(${opt.rot || 0}) scale(${s})` }, g);
  el('line', { x1: 0, y1: -38, x2: 0, y2: -24, stroke: WHT, 'stroke-width': 3 }, lg);
  el('rect', { x: -18, y: -26, width: 36, height: 9, fill: BLK, stroke: WHT, 'stroke-width': 2 }, lg);
  el('path', { d: 'M-18,-18 C-40,-6 -40,34 -18,46 L18,46 C40,34 40,-6 18,-18Z', fill: opt.body || WHT, stroke: BLK, 'stroke-width': 2.5 }, lg);
  for (const yy of [-6, 6, 18, 30]) {
    const w = 33 - Math.abs(yy - 14) * 0.25;
    el('path', { d: `M${-w},${yy} Q0,${yy + 5} ${w},${yy}`, fill: 'none', stroke: opt.rib || BLK, 'stroke-width': 1.6, opacity: 0.55 }, lg);
  }
  el('rect', { x: -18, y: 45, width: 36, height: 9, fill: BLK, stroke: WHT, 'stroke-width': 2 }, lg);
  el('path', { d: 'M-6,54 L-8,74 M0,54 L0,78 M6,54 L8,74', stroke: opt.tassel || RED, 'stroke-width': 3 }, lg);
  const t = el('text', { x: 0, y: 26, 'text-anchor': 'middle', 'font-family': 'Noto Serif SC', 'font-weight': 900, 'font-size': 30, fill: opt.ink || RED }, lg);
  t.textContent = label;
  return lg;
}
(function string() {
  const g = el('g', {}, bg);
  const pts = [[-20, 250], [130, 296], [280, 318], [430, 300], [580, 248]];
  el('path', { d: `M${pts[0]}Q140,320 300,320T600,240`, fill: 'none', stroke: WHT, 'stroke-width': 3 }, g);
  lantern(g, 98, 330, 1.25, '百', { rot: -4 });
  lantern(g, 236, 352, 1.05, '鬼', { rot: 6, body: RED, ink: WHT, rib: WHT, tassel: WHT });
  lantern(g, 372, 350, 1.18, '夜', { rot: -8 });
  lantern(g, 510, 308, 0.95, '行', { rot: 5, body: RED, ink: WHT, rib: WHT, tassel: WHT });
})();

// hitodama (spirit flames) floating
function wisp(g, x, y, s, rot, fill = WHT) {
  el('path', { d: 'M0,0 C22,0 30,24 14,40 C2,52 -26,46 -24,22 C-22,6 -14,-6 -30,-36 C-6,-26 -12,-4 0,0Z', fill,
    transform: `translate(${x},${y}) rotate(${rot}) scale(${s})` }, g);
}

// big white burst behind the hero (cut-out paper)
(function heroBurst() {
  const d = burst(560, 690, 15, 365, 255, -0.2, 0.22);
  el('path', { d, fill: BLK, transform: 'translate(18,18)' }, bg);
  el('path', { d, fill: WHT }, bg);
  const g = el('g', { 'clip-path': clipTo(d) }, bg);
  halftone(g, { x0: 160, y0: 300, x1: 960, y1: 1080, step: 16, rmax: 7.6,
    fn: (x, y) => clamp((Math.hypot(x - 560, y - 690) - 170) / 200), fill: RED });
})();

// red/black slanted strip behind title region
(function titleBand() {
  const band = torn([[0, 1140, 0], [1080, 990, 20], [1080, 1395, 0], [0, 1560, 20]], 20);
  el('path', { d: band, fill: WHT, transform: 'translate(0,16)' }, bg);
  el('path', { d: band, fill: BLK }, bg);
  const g = el('g', { 'clip-path': clipTo(band) }, bg);
  el('rect', { x: 0, y: 900, width: 1080, height: 800, fill: 'url(#hatchW)', opacity: 0.11 }, g);
  halftone(g, { x0: 0, y0: 980, x1: 1080, y1: 1570, step: 18, rmax: 8.5,
    fn: (x, y) => clamp(1 - (x + (1560 - y) * 1.4) / 620), fill: RED });
})();

// red zone below title band: black halftone + white speed slashes
halftone(bg, { x0: 0, y0: 1380, x1: 1080, y1: 1920, step: 20, rmax: 9,
  fn: (x, y) => clamp((y - 1500) / 380) * clamp(1.2 - x / 1000), fill: BLK });

/* ====================================================================
   L1  HERO FIGURE (local coords, mid-leap toward the moon)
   ==================================================================== */
const mid = document.getElementById('midRoot');

(function hero() {
  const wrap = el('g', { filter: 'url(#sticker)' }, mid);
  const g = el('g', { transform: 'translate(-34,198) scale(1.32)' }, wrap);

  // scarf (red, streaming behind) - under everything
  el('path', { d: limb([[566, 214], [480, 186], [400, 204], [318, 168], [228, 188], [128, 146]], [30, 28, 26, 22, 16, 2]), fill: RED, stroke: BLK, 'stroke-width': 3 }, g);
  el('path', { d: limb([[540, 212], [470, 226], [400, 252], [318, 250], [236, 286]], [22, 20, 16, 12, 2]), fill: RED, stroke: BLK, 'stroke-width': 3 }, g);

  // back arm (flung back for balance)
  el('path', { d: limb([[505, 244], [430, 286], [350, 266]], [36, 28, 22]), fill: BLK }, g);
  el('circle', { cx: 342, cy: 263, r: 17, fill: BLK }, g);

  // back leg (trailing)
  el('path', { d: limb([[452, 405], [418, 520], [338, 598]], [52, 40, 30]), fill: BLK }, g);
  el('path', { d: limb([[346, 590], [300, 628], [262, 650]], [38, 26, 4]), fill: BLK }, g);

  // coat
  const coat = [[575, 200], [562, 226], [590, 248], [582, 300], [544, 365], [514, 415],
    [440, 468], [340, 535], [255, 605], [196, 672],
    [285, 585], [345, 522], [372, 492],
    [270, 514], [160, 550], [34, 574],
    [150, 502], [260, 456], [318, 430],
    [220, 394], [80, 362],
    [215, 330], [335, 320], [420, 292],
    [468, 250], [496, 214], [512, 168], [538, 206]];
  const coatD = P(coat);
  el('path', { d: coatD, fill: BLK }, g);
  // red lining on the flaring tails (with tone)
  const lining = el('g', {}, g);
  el('path', { d: P([[425, 480], [330, 548], [232, 636], [298, 572], [356, 512]]), fill: RED }, lining);
  el('path', { d: P([[330, 488], [230, 525], [96, 566], [210, 508], [300, 470]]), fill: RED }, lining);
  el('path', { d: P([[290, 418], [190, 395], [112, 368], [220, 380]]), fill: RED }, lining);
  // white fold slashes on coat
  const cc = el('g', { 'clip-path': (() => { const id = 'coatClip'; const cp = el('clipPath', { id }, document.querySelector('#bg defs')); el('path', { d: coatD, transform: 'translate(-34,198) scale(1.32)' }, cp); return 'url(#coatClip)'; })() }, wrap);
  // (fold lines drawn in local coords inside a second transformed group)
  const fl = el('g', { transform: 'translate(-34,198) scale(1.32)' }, cc);
  [[[548, 262], [470, 330], [380, 372], [260, 410]], [[530, 330], [450, 400], [360, 450], [240, 500]], [[560, 300], [520, 360], [470, 420]]].forEach(l => {
    el('path', { d: 'M' + l.join('L'), fill: 'none', stroke: WHT, 'stroke-width': 3.2, 'stroke-linejoin': 'miter' }, fl);
  });

  // front leg (knee driven up)
  const g2 = el('g', { transform: 'translate(-34,198) scale(1.32)' }, wrap);
  el('path', { d: limb([[480, 392], [578, 428], [562, 532]], [52, 42, 32]), fill: BLK }, g2);
  el('circle', { cx: 578, cy: 428, r: 21, fill: BLK }, g2);
  el('path', { d: limb([[556, 524], [596, 550], [640, 566]], [40, 30, 4]), fill: BLK }, g2);
  // white rim lights on legs
  el('path', { d: 'M600,440 L586,520', stroke: WHT, 'stroke-width': 3.5 }, g2);
  el('path', { d: 'M512,384 L574,406', stroke: WHT, 'stroke-width': 3 }, g2);

  // front arm reaching for the moon
  el('path', { d: limb([[578, 250], [656, 214], [726, 152]], [38, 30, 22]), fill: BLK }, g2);
  el('circle', { cx: 656, cy: 214, r: 15, fill: BLK }, g2);
  el('circle', { cx: 738, cy: 140, r: 17, fill: BLK }, g2);
  [[-112, 30], [-78, 40], [-55, 44], [-33, 40], [-10, 32]].forEach(([a, len]) => {
    const r = a * Math.PI / 180, x0 = 738, y0 = 140;
    el('path', { d: limb([[x0, y0], [x0 + Math.cos(r) * len, y0 + Math.sin(r) * len]], [10, 5]), fill: BLK }, g2);
  });
  el('path', { d: 'M600,236 L700,170', stroke: WHT, 'stroke-width': 3 }, g2);

  // neck + head + hair

   L2 / L4  TYPOGRAPHY  (ransom-note pieces)
   ==================================================================== */
const T = document.getElementById('type');
const T2 = document.getElementById('type2');
function piece(parent, { ch, x, y, size, font = 'sans9', bg, fg, rot = 0, back, backRot = 0, pad = 0.12, sx = 1, clip, shadow, border, glyphRot = 0, ls = 0, glyphDy = 0 }) {
  const p = document.createElement('div');
  p.className = 'piece';
  p.style.left = x + 'px'; p.style.top = y + 'px';
  parent.appendChild(p);
  const inner = document.createElement('div');
  inner.style.position = 'relative';
  inner.style.transform = `rotate(${rot}deg)`;
  if (shadow) inner.style.filter = `drop-shadow(${shadow})`;
  p.appendChild(inner);
  if (back) {
    const b = document.createElement('div');
    b.className = 'plate';
    b.style.background = back;
    b.style.inset = `-${size * 0.07}px -${size * 0.08}px -${size * 0.06}px -${size * 0.07}px`;
    b.style.transform = `rotate(${backRot}deg)`;
    b.style.clipPath = 'polygon(3% 0, 100% 6%, 96% 100%, 0 93%)';
    inner.appendChild(b);
  }
  const f = document.createElement('div');
  f.className = 'glyph ' + font;
  f.style.fontSize = size + 'px';
  f.style.padding = `${size * pad}px ${size * pad * 1.05}px`;
  f.style.background = bg;
  f.style.color = fg;
  f.style.letterSpacing = ls + 'px';
  if (border) f.style.outline = border;
  f.style.clipPath = clip || `polygon(${R(0, 6)}% ${R(0, 7)}%, ${R(94, 100)}% ${R(0, 5)}%, 100% ${R(93, 100)}%, ${R(0, 5)}% 100%)`;
  const span = document.createElement('span');
  span.textContent = ch;
  span.style.display = 'inline-block';
  span.style.transform = `rotate(${glyphRot}deg) scaleX(${sx}) translateY(${glyphDy}px)`;
  f.appendChild(span);
  inner.appendChild(f);
  return p;
}
