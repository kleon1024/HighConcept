<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head><body style="margin:0"><canvas id="c" width="512" height="512"></canvas>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;
import { Lines, Points } from '../src/fx.js';
import { ENV } from '../src/materials.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), preserveDrawingBuffer: true }); r.setSize(512, 512, false);
const sc = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(50, 1, 1, 10000); cam.position.set(0, 0, 100); cam.lookAt(0, 0, 0); cam.updateMatrixWorld();
ENV.uCamPos.value.copy(cam.position); ENV.uFogDen.value = 0;
const L = new Lines(10); sc.add(L.mesh); const P = new Points(10); sc.add(P.mesh);
L.begin(); L.add(new THREE.Vector3(-20, -20, 0), new THREE.Vector3(20, 20, 0), 1, 3, new THREE.Color(1, 0.5, 0.2), 0.2, 1.5); L.end();
P.begin(); P.add(new THREE.Vector3(20, -20, 0), 8, new THREE.Color(0.2, 0.8, 1), 1); P.end();
r.setClearColor(0x202020); r.render(sc, cam);
console.log('calls', r.info.render.calls, 'tris', r.info.render.triangles, 'progs', r.info.programs.length);
const gl0 = r.getContext(); console.log('glerr', gl0.getError());
for (const pr of r.info.programs) { const prog = pr.program; console.log('prog', pr.name, gl0.getProgramParameter(prog, gl0.ACTIVE_ATTRIBUTES)); for (let i = 0; i < gl0.getProgramParameter(prog, gl0.ACTIVE_ATTRIBUTES); i++) { const a = gl0.getActiveAttrib(prog, i); console.log('  attr', a.name, gl0.getAttribLocation(prog, a.name)); } }
const px = new Uint8Array(4); const gl = r.getContext(); gl.readPixels(256, 256, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); console.log('centre px', Array.from(px).join(','));
window.__ready = true;
</script></body></html>
