<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Distortion Film</title>
<link rel="stylesheet" href="node_modules/@fontsource/big-shoulders-display/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">

<style>
  html, body { margin: 0; padding: 0; background: #050506; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050506; }

  svg text { font-family: 'JetBrains Mono', monospace; }
</style>

<body>
<div id="stage">
  <svg id="under" viewBox="0 0 1080 1920"></svg>
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="post" width="1080" height="1920"></canvas>
  <canvas id="bloom" width="1080" height="1920"></canvas>
  <svg id="over" viewBox="0 0 1080 1920"></svg>
  <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<script type="module" src="./src/main.js"></script>

</html>
